name: CI

on:
  push:
    branches: [main, devel]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Nim ${{ matrix.nim-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        nim-version: ["2.2.0", stable]

    steps:
      - name: Checkout Joubako
        uses: actions/checkout@v4

      - name: Checkout FlowBrigade
        uses: actions/checkout@v4
        with:
          repository: puffball1567/flowbrigade
          ref: v0.5.0
          path: _deps/flowbrigade

      - name: Checkout NIFKit
        uses: actions/checkout@v4
        with:
          repository: puffball1567/nifkit
          ref: v0.2.0
          path: _deps/nifkit

      - name: Checkout nim-zlib
        uses: actions/checkout@v4
        with:
          repository: status-im/nim-zlib
          ref: v0.2.0
          path: _deps/zlib
          submodules: recursive

      - name: Checkout zlib Nim dependencies
        uses: actions/checkout@v4
        with:
          repository: status-im/nim-stew
          ref: v0.4.2
          path: _deps/stew

      - name: Checkout results
        uses: actions/checkout@v4
        with:
          repository: arnetheduck/nim-results
          ref: v0.5.1
          path: _deps/results

      - name: Checkout unittest2
        uses: actions/checkout@v4
        with:
          repository: status-im/nim-unittest2
          ref: v0.2.5
          path: _deps/unittest2

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}

      - name: Register local dependencies
        run: |
          nimble develop -y -a:_deps/flowbrigade
          nimble develop -y -a:_deps/nifkit
          nimble develop -y -a:_deps/results
          nimble develop -y -a:_deps/unittest2
          nimble develop -y -a:_deps/stew
          nimble develop -y -a:_deps/zlib

      - name: Resolve dependencies
        run: nimble --legacy --offline setup

      - name: Check package and public entry point
        run: |
          nimble check
          nim check --mm:arc --path:src src/joubako.nim
          nim check --mm:arc --path:src examples/basic.nim
          nim check --mm:arc --path:src benchmarks/core_bench.nim

      - name: Run tests
        run: nimble --legacy --offline test

      - name: Run hardening fuzz and soak probes
        if: matrix.os == 'ubuntu-latest' && matrix.nim-version == 'stable'
        run: |
          nimble --legacy --offline fuzz
          nimble --legacy --offline soak

  ssl:
    name: Linux SSL build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Joubako
        uses: actions/checkout@v4

      - name: Checkout FlowBrigade
        uses: actions/checkout@v4
        with:
          repository: puffball1567/flowbrigade
          ref: v0.5.0
          path: _deps/flowbrigade

      - name: Checkout NIFKit
        uses: actions/checkout@v4
        with:
          repository: puffball1567/nifkit
          ref: v0.2.0
          path: _deps/nifkit

      - name: Checkout nim-zlib
        uses: actions/checkout@v4
        with:
          repository: status-im/nim-zlib
          ref: v0.2.0
          path: _deps/zlib
          submodules: recursive

      - name: Checkout zlib Nim dependencies
        uses: actions/checkout@v4
        with:
          repository: status-im/nim-stew
          ref: v0.4.2
          path: _deps/stew

      - name: Checkout results
        uses: actions/checkout@v4
        with:
          repository: arnetheduck/nim-results
          ref: v0.5.1
          path: _deps/results

      - name: Checkout unittest2
        uses: actions/checkout@v4
        with:
          repository: status-im/nim-unittest2
          ref: v0.2.5
          path: _deps/unittest2

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable

      - name: Register local dependencies
        run: |
          nimble develop -y -a:_deps/flowbrigade
          nimble develop -y -a:_deps/nifkit
          nimble develop -y -a:_deps/results
          nimble develop -y -a:_deps/unittest2
          nimble develop -y -a:_deps/stew
          nimble develop -y -a:_deps/zlib

      - name: Build and test with SSL
        run: |
          nim c -d:ssl --mm:arc --path:src src/joubako.nim
          nim c -r -d:ssl --mm:arc --path:src tests/test_tls_options.nim
          nim c -r -d:ssl --mm:arc --path:src tests/test_http.nim
          nimble --legacy --offline testSsl

  docker-e2e:
    name: Linux Docker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Joubako
        uses: actions/checkout@v4

      - name: Build and run cross-container suite
        run: |
          docker compose -f tests/e2e/compose.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from client

      - name: Show container logs
        if: failure()
        run: docker compose -f tests/e2e/compose.yml logs --no-color

      - name: Remove E2E containers
        if: always()
        run: docker compose -f tests/e2e/compose.yml down --volumes --remove-orphans

  valgrind:
    name: Linux Valgrind leak probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Joubako
        uses: actions/checkout@v4

      - name: Checkout FlowBrigade
        uses: actions/checkout@v4
        with:
          repository: puffball1567/flowbrigade
          ref: v0.5.0
          path: _deps/flowbrigade

      - name: Checkout NIFKit
        uses: actions/checkout@v4
        with:
          repository: puffball1567/nifkit
          ref: v0.2.0
          path: _deps/nifkit

      - name: Checkout nim-zlib
        uses: actions/checkout@v4
        with:
          repository: status-im/nim-zlib
          ref: v0.2.0
          path: _deps/zlib
          submodules: recursive

      - name: Checkout zlib Nim dependencies
        uses: actions/checkout@v4
        with:
          repository: status-im/nim-stew
          ref: v0.4.2
          path: _deps/stew

      - name: Checkout results
        uses: actions/checkout@v4
        with:
          repository: arnetheduck/nim-results
          ref: v0.5.1
          path: _deps/results

      - name: Checkout unittest2
        uses: actions/checkout@v4
        with:
          repository: status-im/nim-unittest2
          ref: v0.2.5
          path: _deps/unittest2

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable

      - name: Register local dependencies
        run: |
          nimble develop -y -a:_deps/flowbrigade
          nimble develop -y -a:_deps/nifkit
          nimble develop -y -a:_deps/results
          nimble develop -y -a:_deps/unittest2
          nimble develop -y -a:_deps/stew
          nimble develop -y -a:_deps/zlib

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Run ARC success-path lifecycle leak probe
        run: nimble --legacy --offline leak
