      - name: Build and test public SSL surfaces
        run: |
          nim c -d:ssl --mm:${{ matrix.memory-manager }} --path:src src/joubako.nim
          nim c -d:ssl --mm:${{ matrix.memory-manager }} --path:src examples/frameworks/client.nim
          nim c -r -d:ssl --mm:${{ matrix.memory-manager }} --path:src tests/test_tls_options.nim
          nim c -r -d:ssl --mm:${{ matrix.memory-manager }} --path:src tests/test_http.nim

      - name: Run ARC secure transport integration tests
        if: matrix.memory-manager == 'arc'
        run: nimble --legacy --offline testSsl

      - name: Run ORC secure transport integration tests
        if: matrix.memory-manager == 'orc'
        run: nimble --legacy --offline testSslOrc

  docker-e2e:
    name: Linux Docker E2E / ${{ matrix.memory-manager }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        memory-manager: [arc, orc]
    env:
      JOUBAKO_MEMORY_MANAGER: ${{ matrix.memory-manager }}
    steps:
      - name: Checkout Joubako
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and run cross-container suite
        run: |
          docker compose -f tests/e2e/compose.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from client

      - name: Show container logs
        if: failure()
        run: docker compose -f tests/e2e/compose.yml logs --no-color

      - name: Remove E2E containers
        if: always()
        run: docker compose -f tests/e2e/compose.yml down --volumes --remove-orphans

  valgrind:
    name: Linux Valgrind leak probe / ${{ matrix.memory-manager }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        memory-manager: [arc, orc]
    steps:
      - name: Checkout Joubako
