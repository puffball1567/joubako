name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Nim ${{ matrix.nim-version }} / ${{ matrix.memory-manager }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        nim-version: ["2.2.0", stable]
        memory-manager: [arc, orc]

    steps:
      - name: Checkout Joubako
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout FlowBrigade
        uses: actions/checkout@v4
        with:
          repository: puffball1567/flowbrigade
          ref: v0.5.0
          path: _deps/flowbrigade

      - name: Checkout NIFKit
        uses: actions/checkout@v4
        with:
          repository: puffball1567/nifkit
          ref: v0.4.0
          path: _deps/nifkit

      - name: Checkout nim-zlib
        uses: actions/checkout@v4
        with:
          repository: status-im/nim-zlib
          ref: v0.2.0
          path: _deps/zlib
          submodules: recursive

      - name: Checkout zlib Nim dependencies
        uses: actions/checkout@v4
        with:
          repository: status-im/nim-stew
          ref: v0.5.1
          path: _deps/stew

      - name: Checkout libcurl Nim bindings
        uses: actions/checkout@v4
        with:
          repository: Araq/libcurl
          ref: v1.0.0
          path: _deps/libcurl

      - name: Checkout results
        uses: actions/checkout@v4
        with:
          repository: arnetheduck/nim-results
          ref: v0.5.1
          path: _deps/results

      - name: Checkout unittest2
        uses: actions/checkout@v4
        with:
          repository: status-im/nim-unittest2
          ref: v0.2.5
          path: _deps/unittest2

      - name: Checkout faststreams
        uses: actions/checkout@v4
        with:
          repository: status-im/nim-faststreams
          ref: 50889cd16ec8771106cdd0eeea460039e8571e06
          path: _deps/faststreams

      - name: Checkout serialization
        uses: actions/checkout@v4
        with:
          repository: status-im/nim-serialization
          ref: v0.5.3
          path: _deps/serialization

      - name: Checkout CBOR serialization
        uses: actions/checkout@v4
        with:
          repository: vacp2p/nim-cbor-serialization
          ref: v0.4.2
          path: _deps/cbor_serialization

      - name: Checkout Protobuf serialization
        uses: actions/checkout@v4
        with:
          repository: status-im/nim-protobuf-serialization
          ref: 24ddb65800b351268412840b19a33c6b61bb3046
          path: _deps/protobuf_serialization

      - name: Checkout npeg
        uses: actions/checkout@v4
        with:
          repository: zevv/npeg
          ref: 1.3.0
          path: _deps/npeg

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}

      - name: Register local dependencies
        run: |
          nimble develop -y -a:_deps/flowbrigade
          nimble develop -y -a:_deps/nifkit
          nimble develop -y -a:_deps/results
          nimble develop -y -a:_deps/unittest2
          nimble develop -y -a:_deps/stew
          nimble develop -y -a:_deps/zlib
          nimble develop -y -a:_deps/libcurl
          nimble develop -y -a:_deps/faststreams
          nimble develop -y -a:_deps/serialization
          nimble develop -y -a:_deps/npeg
          nimble develop -y -a:_deps/cbor_serialization
          nimble develop -y -a:_deps/protobuf_serialization

      - name: Generate pinned dependency paths
        run: nim r --out:${{ runner.temp }}/joubako-write-ci-paths .github/write_ci_paths.nim

      - name: Check package metadata
        run: nimble check

      - name: Check public entry point
        if: matrix.nim-version == 'stable'
        run: |
          nim check --mm:${{ matrix.memory-manager }} --path:src src/joubako.nim
          nim check --mm:${{ matrix.memory-manager }} --path:src examples/basic.nim
          nim check --mm:${{ matrix.memory-manager }} --path:src examples/frameworks/client.nim
          nim check --mm:${{ matrix.memory-manager }} --path:src benchmarks/core_bench.nim
          nim check --mm:${{ matrix.memory-manager }} --path:src benchmarks/network_bench.nim
          nim check --threads:on --mm:${{ matrix.memory-manager }} --path:src tests/tsan_probe.nim

      - name: Run ARC tests with Nim 2.2 Nimble
        if: matrix.nim-version == '2.2.0' && matrix.memory-manager == 'arc'
        run: nimble --offline test

      - name: Run ORC tests with Nim 2.2 Nimble
        if: matrix.nim-version == '2.2.0' && matrix.memory-manager == 'orc'
        run: nimble --offline testOrc

      - name: Run ARC tests with stable Nimble
        if: matrix.nim-version == 'stable' && matrix.memory-manager == 'arc'
        run: nimble --legacy --offline test

      - name: Run ORC tests with stable Nimble
        if: matrix.nim-version == 'stable' && matrix.memory-manager == 'orc'
        run: nimble --legacy --offline testOrc

      - name: Run Linux ARC AddressSanitizer probes with leak detection
        if: matrix.os == 'ubuntu-latest' && matrix.nim-version == 'stable' && matrix.memory-manager == 'arc'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          LSAN_OPTIONS: exitcode=99
          JOUBAKO_FUZZ_ITERATIONS: 2000
        run: nimble --legacy --offline asan

      - name: Run Linux ORC AddressSanitizer probes with leak detection
        if: matrix.os == 'ubuntu-latest' && matrix.nim-version == 'stable' && matrix.memory-manager == 'orc'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          LSAN_OPTIONS: exitcode=99
          JOUBAKO_FUZZ_ITERATIONS: 2000
        run: nimble --legacy --offline asanOrc

      - name: Run macOS ARC AddressSanitizer probes
        if: matrix.os == 'macos-latest' && matrix.nim-version == 'stable' && matrix.memory-manager == 'arc'
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          JOUBAKO_FUZZ_ITERATIONS: 2000
        run: nimble --legacy --offline asan

      - name: Run macOS ORC AddressSanitizer probes
        if: matrix.os == 'macos-latest' && matrix.nim-version == 'stable' && matrix.memory-manager == 'orc'
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          JOUBAKO_FUZZ_ITERATIONS: 2000
        run: nimble --legacy --offline asanOrc

      - name: Run Windows Clang ARC AddressSanitizer probes
        if: matrix.os == 'windows-latest' && matrix.nim-version == 'stable' && matrix.memory-manager == 'arc'
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          JOUBAKO_FUZZ_ITERATIONS: 2000
        run: nimble --legacy --offline asan

      - name: Run Windows Clang ORC AddressSanitizer probes
        if: matrix.os == 'windows-latest' && matrix.nim-version == 'stable' && matrix.memory-manager == 'orc'
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          JOUBAKO_FUZZ_ITERATIONS: 2000
        run: nimble --legacy --offline asanOrc

      - name: Run Linux and macOS ARC UndefinedBehaviorSanitizer probes
        if: matrix.os != 'windows-latest' && matrix.nim-version == 'stable' && matrix.memory-manager == 'arc'
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          JOUBAKO_FUZZ_ITERATIONS: 1000
        run: nimble --legacy --offline ubsan

      - name: Run Linux and macOS ORC UndefinedBehaviorSanitizer probes
        if: matrix.os != 'windows-latest' && matrix.nim-version == 'stable' && matrix.memory-manager == 'orc'
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          JOUBAKO_FUZZ_ITERATIONS: 1000
        run: nimble --legacy --offline ubsanOrc

      - name: Run Linux ARC standalone LeakSanitizer probe
        if: matrix.os == 'ubuntu-latest' && matrix.nim-version == 'stable' && matrix.memory-manager == 'arc'
        env:
          LSAN_OPTIONS: detect_leaks=1:exitcode=99
        run: nimble --legacy --offline lsan

      - name: Run Linux ORC standalone LeakSanitizer probe
        if: matrix.os == 'ubuntu-latest' && matrix.nim-version == 'stable' && matrix.memory-manager == 'orc'
        env:
          LSAN_OPTIONS: detect_leaks=1:exitcode=99
        run: nimble --legacy --offline lsanOrc

      - name: Run Linux and macOS ARC ThreadSanitizer probe
        if: matrix.os != 'windows-latest' && matrix.nim-version == 'stable' && matrix.memory-manager == 'arc'
        env:
          TSAN_OPTIONS: halt_on_error=1:exitcode=99
          JOUBAKO_THREAD_ITERATIONS: 500
        run: nimble --legacy --offline tsan

      - name: Run Linux and macOS ORC ThreadSanitizer probe
        if: matrix.os != 'windows-latest' && matrix.nim-version == 'stable' && matrix.memory-manager == 'orc'
        env:
          TSAN_OPTIONS: halt_on_error=1:exitcode=99
          JOUBAKO_THREAD_ITERATIONS: 500
        run: nimble --legacy --offline tsanOrc

      - name: Run ARC hardening fuzz and soak probes
        if: matrix.os == 'ubuntu-latest' && matrix.nim-version == 'stable' && matrix.memory-manager == 'arc'
        run: |
          nimble --legacy --offline fuzz
          nimble --legacy --offline soak

      - name: Run ORC hardening fuzz and soak probes
        if: matrix.os == 'ubuntu-latest' && matrix.nim-version == 'stable' && matrix.memory-manager == 'orc'
        run: |
          nimble --legacy --offline fuzzOrc
          nimble --legacy --offline soakOrc

  ssl:
    name: Linux SSL build / ${{ matrix.memory-manager }}
